  <path d="M150 300 C150 245 175 225 215 225 C255 225 280 245 280 300 Z" fill="#6b7280"/>
  <circle cx="215" cy="200" r="28" fill="#4b5563"/>
  <!-- 右手とマウス -->
  <path d="M265 255 C290 250 320 255 345 262" stroke="#6b7280" stroke-width="16" stroke-linecap="round" fill="none"/>
  <ellipse cx="358" cy="266" rx="18" ry="24" fill="#e5e7eb" stroke="#9ca3af" stroke-width="3"/>
  <line x1="358" y1="244" x2="358" y2="260" stroke="#9ca3af" stroke-width="2"/>
  <!-- クリックの効果 -->
  <g stroke="#ef4444" stroke-width="3" stroke-linecap="round">
    <line x1="382" y1="246" x2="396" y2="236"/><line x1="386" y1="262" x2="402" y2="262"/>
    <line x1="382" y1="278" x2="396" y2="288"/>
  </g>
  <text x="395" y="225" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ef4444">ポチポチ</text>
