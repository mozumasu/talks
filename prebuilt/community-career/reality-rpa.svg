  <rect x="296" y="52" width="70" height="134" fill="#f9fafb" stroke="#e5e7eb"/>
  <g fill="#d1d5db"><rect x="301" y="60" width="44" height="4" rx="1"/><rect x="301" y="80" width="30" height="4" rx="1"/><rect x="301" y="108" width="34" height="4" rx="1"/><rect x="301" y="136" width="38" height="4" rx="1"/></g>
  <g fill="#fff" stroke="#d1d5db"><rect x="301" y="88" width="60" height="12" rx="2"/><rect x="301" y="116" width="60" height="12" rx="2"/></g>
  <rect x="301" y="144" width="8" height="8" rx="1" fill="#fff" stroke="#9ca3af"/>
  <rect x="320" y="162" width="40" height="16" rx="3" fill="#3b82f6"/>
  <text x="340" y="173.5" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#fff">Apply</text>
  <path d="M244 142 L244 162 L249 157 L253 166 L257 164 L253 155 L260 155 Z" fill="#111827" stroke="#fff" stroke-width="1.5"/>
  <rect x="225" y="190" width="30" height="22" fill="#9ca3af"/>
