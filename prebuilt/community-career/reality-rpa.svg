  <line x1="250" y1="76" x2="250" y2="160" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="250" cy="70" r="9" fill="#84cc16"/>
  <path d="M247 66 L254 70 L247 74 Z" fill="#fff"/>
  <rect x="238" y="102" width="24" height="24" rx="4" fill="#6b7280" stroke="#fff" stroke-width="2"/>
  <rect x="244" y="108" width="12" height="12" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="250" cy="162" r="9" fill="#f97316"/>
  <rect x="246" y="158" width="8" height="8" fill="#fff"/>
  <!-- 一覧からフローへドラッグする -->
  <path d="M196 116 C215 116 222 140 238 142" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <rect x="226" y="134" width="22" height="16" rx="3" fill="#bfdbfe" stroke="#3b82f6" stroke-dasharray="3 2"/>
