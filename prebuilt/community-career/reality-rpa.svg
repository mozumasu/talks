  <g fill="#d1d5db"><circle cx="124" cy="43" r="4"/><circle cx="136" cy="43" r="4"/><circle cx="148" cy="43" r="4"/></g>
  <!-- RPA のフローエディタ (左: メニュー / アクション一覧、中央: フロー、右: 設定) -->
  <rect x="114" y="52" width="26" height="134" fill="#374151"/>
  <g fill="#9ca3af"><rect x="119" y="60" width="16" height="4" rx="1"/><rect x="119" y="72" width="16" height="4" rx="1"/><rect x="119" y="84" width="16" height="4" rx="1"/></g>
  <rect x="140" y="52" width="58" height="134" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="145" y="58" width="48" height="9" rx="2" fill="#fff" stroke="#d1d5db"/>
  <g fill="#d1d5db">
    <rect x="145" y="74" width="40" height="4" rx="1"/><rect x="145" y="84" width="34" height="4" rx="1"/>
    <rect x="145" y="94" width="42" height="4" rx="1"/><rect x="145" y="104" width="30" height="4" rx="1"/>
    <rect x="145" y="124" width="36" height="4" rx="1"/><rect x="145" y="134" width="40" height="4" rx="1"/>
  </g>
  <rect x="143" y="112" width="52" height="9" rx="2" fill="#dbeafe"/>
  <rect x="146" y="114.5" width="36" height="4" rx="1" fill="#3b82f6"/>
