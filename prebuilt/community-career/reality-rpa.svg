<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <rect width="480" height="300" rx="12" fill="#f3f4f6"/>
  <!-- モニター -->
  <rect x="110" y="30" width="260" height="160" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="4"/>
