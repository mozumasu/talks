<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <rect width="480" height="300" rx="12" fill="#0d1117"/>
  <!-- モニター -->
  <rect x="110" y="30" width="260" height="160" rx="8" fill="#161b22" stroke="#30363d" stroke-width="4"/>
  <g font-family="Menlo, monospace" font-size="11" fill="#3fb950">
    <text x="124" y="54">$ nvim ~/.config/wezterm/wezterm.lua</text>
    <text x="124" y="72">$ git rebase -i HEAD~3</text>
    <text x="124" y="90">$ ghq get mozumasu/dotfiles</text>
    <text x="124" y="108">$ fzf | xargs bat</text>
    <text x="124" y="126">$ gh pr create --fill</text>
    <text x="124" y="144">$ kubectl get pods -A</text>
    <text x="124" y="162">$ █</text>
  </g>
  <rect x="225" y="190" width="30" height="22" fill="#30363d"/>
  <!-- フードの人 (後ろ姿) -->
  <path d="M170 300 C170 240 195 215 240 215 C285 215 310 240 310 300 Z" fill="#21262d"/>
  <path d="M205 245 C200 200 215 175 240 175 C265 175 280 200 275 245 C262 232 218 232 205 245 Z" fill="#2d333b"/>
  <!-- キーボード -->
  <rect x="140" y="262" width="200" height="24" rx="4" fill="#30363d"/>
  <g fill="#3fb950" opacity="0.6">
    <rect x="150" y="268" width="14" height="5" rx="1"/><rect x="170" y="268" width="14" height="5" rx="1"/>
    <rect x="190" y="268" width="14" height="5" rx="1"/><rect x="276" y="268" width="14" height="5" rx="1"/>
    <rect x="296" y="268" width="14" height="5" rx="1"/><rect x="316" y="268" width="14" height="5" rx="1"/>
  </g>
  <!-- 打鍵の効果 -->
  <g stroke="#3fb950" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="250" x2="104" y2="240"/><line x1="118" y1="268" x2="98" y2="268"/>
    <line x1="360" y1="250" x2="376" y2="240"/><line x1="362" y1="268" x2="382" y2="268"/>
  </g>
  <text x="400" y="230" font-family="sans-serif" font-size="18" font-weight="bold" fill="#3fb950">ﾀﾀﾀｯ</text>
