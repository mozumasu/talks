name: Deploy slides to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-slides
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch を main 以外の ref で実行してもデプロイさせない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # デッキの package.json が link:../../../findy-slidev/... を参照するため、
      # talks と findy-slidev を兄弟ディレクトリとして checkout する
      - name: Checkout talks
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: talks
          persist-credentials: false

      - name: Checkout theme repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mozumasu/findy-slidev
          # 再現性のため theme のコミットを固定する。更新時はここを上げる
          ref: main
          path: findy-slidev
          token: ${{ secrets.THEME_REPO_READ_TOKEN }}
          persist-credentials: false

      # バージョンは root package.json の packageManager フィールドから読む
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: talks/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            talks/pnpm-lock.yaml
            findy-slidev/pnpm-lock.yaml

      # link: 参照はリンク先の依存を自動インストールしないため、テーマ側も install する
      - name: Install theme dependencies
        working-directory: findy-slidev
        run: pnpm install --frozen-lockfile

      - name: Install talks dependencies
        working-directory: talks
        run: pnpm install --frozen-lockfile

      - name: Build all decks
        working-directory: talks
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: talks
