<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
  <rect width="480" height="320" rx="12" fill="#fff7ed"/>
  <!-- テーブル -->
  <rect x="40" y="250" width="400" height="14" rx="4" fill="#d6a77a"/>
  <!-- 左: 熱く語るオタク (ノート PC にターミナル) -->
  <path d="M60 250 C60 205 80 185 115 185 C150 185 170 205 170 250 Z" fill="#374151"/>
  <circle cx="115" cy="160" r="26" fill="#4b5563"/>
  <!-- 身振りの腕 -->
  <path d="M150 205 C170 190 180 170 182 150" stroke="#374151" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- ノート PC -->
  <path d="M150 250 L170 196 L246 196 L232 250 Z" fill="#1f2937"/>
  <rect x="158" y="246" width="96" height="6" rx="2" fill="#6b7280"/>
  <g font-family="Menlo, monospace" font-size="8" fill="#22c55e">
    <text x="176" y="212">~/dotfiles</text>
    <text x="172" y="224">$ nvim .</text>
    <text x="168" y="236">:wq█</text>
  </g>
  <!-- 吹き出し -->
  <rect x="30" y="40" width="210" height="78" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
  <path d="M100 116 L112 140 L124 116 Z" fill="#ffffff" stroke="#f97316" stroke-width="3" stroke-linejoin="round"/>
  <rect x="98" y="112" width="28" height="6" fill="#ffffff"/>
  <text x="135" y="72" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111827">WezTerm の設定はね…!</text>
  <text x="135" y="98" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111827">Neovim もいいよ!!</text>
  <!-- キラキラ -->
  <g fill="#f59e0b">
    <path d="M200 150 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/>
    <path d="M60 128 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/>
  </g>
  <!-- 右: 聞き入る自分 -->
  <path d="M310 250 C310 205 330 185 365 185 C400 185 420 205 420 250 Z" fill="#9ca3af"/>
  <circle cx="365" cy="160" r="26" fill="#6b7280"/>
  <!-- 目がキラキラ -->
  <g fill="#fde047">
    <path d="M352 156 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z"/>
    <path d="M376 156 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z"/>
  </g>
  <text x="330" y="125" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ef4444">!</text>
</svg>
